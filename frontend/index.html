<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-body-secondary overflow-x-hidden">

  <nav class="navbar bg-success mb-5">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold px-5 text-white">Expense Tracker</a>

      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="darkModeBtn">
        <label class="form-check-label text-white" for="darkModeBtn">Dark</label>
      </div>
    </div>
  </nav>

  <div id="spinner-container" class="mt-5 text-center">
    <div id="spinner-border" class="spinner-border text-success" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div id="alert-container" class="container mt-3"></div>

  <div class="container mb-5">
    <div class="cards">
      <div class="card h-100 shadow-sm border-success rounded-4">
        <div class="card-body">
          <h5 class="card-title text-center text-success">Total Amount</h5>
          <p class="card-text text-center fs-3 fw-semibold" id="totalAmount">0</p>
        </div>
      </div>
  
      <div class="card h-100 shadow-sm border-success rounded-4">
        <div class="card-body">
          <h5 class="card-title text-center text-success">Number of expenses</h5>
          <p class="card-text text-center fs-3 fw-semibold" id="expensesCount">0</p>
        </div>
      </div>
  
      <div class="card h-100 shadow-sm border-success rounded-4">
        <div class="card-body">
          <h5 class="card-title text-center text-success">Highest expense</h5>
          <p class="card-text text-center fs-3 fw-semibold" id="highestExpenseAmount">0</p>
          <p class="card-text text-center fw-medium mb-0" id="highestExpenseTitle"></p>
        </div>
      </div>
    </div>
  </div>


  <div class="container bg-white p-4 mb-5 rounded-4 shadow-sm">
    <form id="addExpenseForm">
      <h3 class="mb-4 text-success fw-bold">Add expense</h3>
      <div class="row g-3">
        <div class="col-12 col-md-3">
          <label for="title" class="form-label fw-semibold">Title</label>
          <input class="form-control" type="text" name="title" id="title" placeholder="eg. Lunch" required
            maxlength="100">
        </div>

        <div class="col-12 col-md-3">
          <label for="amount" class="form-label fw-semibold">Amount</label>
          <input class="form-control" type="number" name="amount" id="amount" placeholder="4.5" required min="0.01"
            step="0.01">
        </div>

        <div class="col-12 col-md-3">
          <label for="category" class="form-label fw-semibold">Category</label>
          <select class="form-select" name="category" id="category" required>
            <option value="" selected disabled>Choose...</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="col-12 col-md-3">
          <label for="date" class="form-label fw-semibold">Date</label>
          <input class="form-control" type="date" name="date" id="date" required>
        </div>
      </div>
      <button type="button" class="btn btn-success mt-4 fw-semibold" id="addExpenseBtn">Add expense</button>
    </form>
  </div>

  <div class="container bg-white p-4 mb-5 rounded-4 shadow-sm">
      <canvas id="chart"></canvas>
  </div>

  <div class="container bg-white p-4 mb-5 rounded-4 shadow-sm">
    <div class="mb-3">
      <div class="row mb-3">
        <div class="col-12">
          <h3 class="mb-0 text-success fw-bold">Expenses</h3>
        </div>
      </div>
  
      <div class="row g-3 mb-3">
        <div class="col-12 col-md-6">
          <div class="d-flex align-items-center gap-2">
            <label for="searchByTitle" class="form-label mb-0 fw-semibold">Search</label>
            <input type="text" name="searchByTitle" id="searchByTitle" class="form-control" placeholder="Search by title...">
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="d-flex align-items-center gap-3 justify-content-md-end">
            <label for="categoryFilter" class="form-label mb-0 fw-semibold">Category</label>
            <select class="form-select w-auto" id="categoryFilter">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>

            <label for="monthFilter" class="form-label mb-0 fw-semibold">Month</label>
            <select class="form-select w-auto" id="monthFilter">
              <option value="All">All</option>
              <option value="01">January</option>
              <option value="02">February</option>
              <option value="03">March</option>
              <option value="04">April</option>
              <option value="05">May</option>
              <option value="06">June</option>
              <option value="07">July</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-success">
          <tr>
            <th>Title</th>
            <th id="sortableAmount">Amount</th>
            <th>Category</th>
            <th id="sortableDate">Date</th>
            <th>Actions</th>
          </tr>
        </thead>
  
        <tbody id="expensesTableBody"></tbody>
      </table>
      <div class="text-end">
        <button class="btn btn-outline-success" id="exportCsvBtn">Export As CSV</button>
      </div>
    </div>
  </div>
  </div>

  <div class="modal" tabindex="-1" id="editExpenseModal">
    <div class="modal-dialog">
      <div class="modal-content rounded-4 shadow">
        <div id="edit-alert-container" class="px-3 pt-3"></div>
        <div class="modal-header">
          <h5 class="modal-title text-success fw-bold">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editExpenseForm">
            <div class="mb-3">
              <label for="editTitle" class="form-label fw-semibold">Title</label>
              <input type="text" class="form-control" id="editTitle" required maxlength="100">
            </div>

            <div class="mb-3">
              <label for="editAmount" class="form-label fw-semibold">Amount</label>
              <input type="number" class="form-control" id="editAmount" required min="0.01" step="0.01">
            </div>

            <div class="mb-3">
              <label for="editCategory" class="form-label fw-semibold">Category</label>
              <select class="form-select" id="editCategory" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="editDate" class="form-label fw-semibold">Date</label>
              <input type="date" class="form-control" id="editDate" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-success" id="saveEditBtn">Save changes</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
